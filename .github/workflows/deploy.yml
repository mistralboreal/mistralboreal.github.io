name: Publish Mistral Boréal to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mistral-boreal-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate FR-CA / EN-CA OKF content
        run: node scripts/validate-okf.mjs

      - name: Check Astro and TypeScript
        run: pnpm run check

      - name: Generate static website
        run: pnpm run build
        env:
          SITE_URL: https://mistralboreal.github.io

      - name: Verify French and English entry points
        run: |
          test -s dist/index.html
          test -s dist/en-ca/index.html
          test -s dist/rencontres/index.html
          test -s dist/en-ca/events/index.html
          test -s dist/ecosysteme/index.html
          test -s dist/en-ca/ecosystem/index.html
          test -s dist/notre-modele/index.html
          test -s dist/en-ca/blueprint/index.html
          test -s dist/downloads/mistral-boreal-community-blueprint.zip
          unzip -t dist/downloads/mistral-boreal-community-blueprint.zip
          echo 'All required FR-CA and EN-CA entry points exist.'

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload static site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
